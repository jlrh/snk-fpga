params:
  - { name: SND_OFFSET,  value: "(`SND_START)>>1" }
  - { name: BG1_OFFSET,  value: "(`BG1_START-`JTFRAME_BA1_START)>>1" }
  - { name: BG2_OFFSET,  value: "(`BG2_START-`JTFRAME_BA1_START)>>1" }
  - { name: PCMA_OFFSET, value: "(`PCMA_START-`JTFRAME_BA3_START)>>1" }
  - { name: PCMB_OFFSET, value: "(`PCMB_START-`JTFRAME_BA3_START)>>1" }
sdram:
  banks:
    - buses:
      - { name: main, addr_width: 19, data_width: 16 }
      - { name: snd,  addr_width: 16, data_width: 8, offset: SND_OFFSET }
    - buses:
      - { name: tx,   addr_width: 17, data_width: 32 }
      - { name: bg1,  addr_width: 19, data_width: 32, offset: BG1_OFFSET }
      - { name: bg2,  addr_width: 19, data_width: 32, offset: BG2_OFFSET }
    - buses:
      - { name: spr1, addr_width: 21, data_width: 32 }
    - buses:
      - { name: spr2, addr_width: 21, data_width: 32 }
      - { name: pcma, addr_width: 19, data_width: 8, offset: PCMA_OFFSET }
      - { name: pcmb, addr_width: 19, data_width: 8, offset: PCMB_OFFSET }
bram:

  - name: scale
    addr_width: 16
    data_width: 8
    prom: true

  - name: nvram
    addr_width: 7
    data_width: 8
    rw: true
    ioctl: { save: true, restore: true, order: 0 }
