[global]
author=["snk-fpga"]

[parse]
sourcefile=[ "snk.cpp" ]
machines=[ "gwar" ]
rename = [
    { setname="gwar", name="Guerrilla War (FF, SNK, 1987)" },
]

[buttons]
names=[
    { machine="gwar", names="Disparo,Granada,Girar izq.,Girar der." }
]

[dipsw]
delete=[{names=["Unused","Unknown"]}]

[ROM]
regions = [
    { name="maincpu" },
    { name="sub",        start="JTFRAME_BA1_START" },
    { name="ym2",        start="PCM_START" },
    { name="audiocpu",   start="JTFRAME_BA2_START" },
    { name="bg_tiles",   start="BG_START" },

    { name="sp16_tiles", start="JTFRAME_BA3_START", frac={ bytes=1, parts=4 } },
    { name="sp32_tiles", start="SP32_START", sequence=[0,2,4,6,1,3,5,7], frac={ bytes=1, parts=4 }, no_offset=true },

    { name="tx_tiles",   start="JTFRAME_PROM_START" },
    { name="proms" },
    { name="rjproms",    skip=true },
]

order = [ "maincpu", "sub", "ym2", "audiocpu", "bg_tiles", "sp16_tiles", "sp32_tiles", "tx_tiles", "proms" ]
