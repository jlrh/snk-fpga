params:
  - { name: PCM_OFFSET,  value: "(`PCM_START-`JTFRAME_BA1_START)>>1" }
  - { name: BG_OFFSET,   value: "(`BG_START-`JTFRAME_BA2_START)>>1" }
  - { name: SP32_OFFSET, value: "(`SP32_START-`JTFRAME_BA3_START)>>1" }

audio:
  rsum: 4.7k
  gain: 0.5
  channels:
    - { name: ym1, module: jtopl, rsum: 4.7k }
    - { name: ym2, module: jtopl, rsum: 4.7k }
sdram:
  banks:

    - buses:
        - { name: main, addr_width: 16, data_width: 8 }

    - buses:
        - { name: sub,  addr_width: 16, data_width: 8 }
        - { name: pcm,  addr_width: 16, data_width: 8, offset: PCM_OFFSET }

    - buses:
        - { name: snd,   addr_width: 16, data_width: 8 }
        - { name: bgrom, addr_width: 18, data_width: 32, offset: BG_OFFSET }

    - buses:
        - { name: s16rom, addr_width: 18, data_width: 32 }
        - { name: s32rom, addr_width: 19, data_width: 32, offset: SP32_OFFSET }
bram:

  - name: txrom
    addr_width: 15
    data_width: 8
    prom: true
    simfile: {}
  - name: palr
    addr_width: 10
    data_width: 8
    prom: true
    simfile: {}
  - name: palg
    addr_width: 10
    data_width: 8
    prom: true
    simfile: {}
  - name: palb
    addr_width: 10
    data_width: 8
    prom: true
    simfile: {}
